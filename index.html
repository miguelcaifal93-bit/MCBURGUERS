  <script>
  const burgers = {
    "nacho-prov": { name: "Nacho Smash Provolone", ingredients: "Base de mayonesa ahumada, doritos, doble carne smash con queso provolone, panceta, doritos, mayonesa ahumada y pan brioche tostado." },
    "legendaria": { name: "Legendaria", ingredients: "Base de salsa MCB (mayonesa, mostaza, ketchup y especias). Medallón de carne smash con queso cheddar, cebolla, pan, salsa MCB, carne smash con queso cheddar, lechuga, cebolla, salsa MCB y pan brioche tostado." },
    "monster": { name: "Monster", ingredients: "Base de mayonesa ahumada, doble carne smash con queso cheddar doble, panceta doble y cebolla caramelizada, mayonesa ahumada y pan brioche tostado." },
    "bbq": { name: "BBQ Brutal", ingredients: "Base de queso crema. Doble carne smash, queso cheddar doble, panceta, cebolla caramelizada, barbacoa y pan brioche tostado." },
    "nacho-ched": { name: "Nacho Smash Cheddar", ingredients: "Base de mayonesa ahumada, doritos, doble carne smash con cheddar, panceta, doritos, mayonesa ahumada y pan brioche tostado." }
  };
  const comboSizes = [
    { id: "chico", label: "Combo Chico", desc: "Burger con carne de 110g + Papas", price: 14000 },
    { id: "mediano", label: "Combo Mediano", desc: "Burger con carne de 110g + Papas + Bebida", price: 18000 },
    { id: "premium", label: "Combo Premium", desc: "Burger con carne de 90g + Papas Gourmet + Bebida", price: 20000 }
  ];
  const extras = [
    { id: "medallon", name: "Medallón extra", price: 3000 },
    { id: "panceta", name: "Panceta extra", price: 1500 },
    { id: "cheddar", name: "Queso cheddar extra", price: 1000 },
    { id: "provolone", name: "Queso provolone extra", price: 1000 },
    { id: "cebolla", name: "Cebolla caramelizada extra", price: 800 },
    { id: "doritos", name: "Doritos extra", price: 800 },
    { id: "huevo", name: "Huevo frito", price: 800 },
    { id: "bbq_salsa", name: "Salsa BBQ extra", price: 500 },
    { id: "mayo", name: "Mayo ahumada extra", price: 500 }
  ];
  const drinks = { "sprite-original": "Sprite Original", "sprite-zero": "Sprite Zero", "coca-original": "Coca-Cola Original", "coca-zero": "Coca-Cola Zero" };
  const drinkPrice = 3500;
  const sauces = ["Barbacoa","Guacamole","Alioli","Big Tau","Mayonesa ahumada","Ketchup","Mostaza","Sabor asado","Picante","Mayonesa picante","Mostaza con miel","Cheddar"];
  const saucePrice = 3000;
  const specialCombos = { parejas: { name: "Combo Parejas (2 adultos)", price: 33000 }, amigos: { name: "Combo Amigos (4 personas)", price: 64000 }, kids: { name: "Combo Kids (1 niño)", price: 10000 }, "kids-2": { name: "Combo Kids x2 (2 niños)", price: 17000 }, familia: { name: "Combo Familia (2 adultos y 2 niños)", price: 54000 } };
  const currency = new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 });
  function getExtraName(ex) { return ex.name; }

  let cart = [], cartIdCounter = 0, currentBurgerId = null, currentCombo = "chico", currentExtras = {}, currentRemovals = {}, currentRemovedIngredients = [], deliveryMethod = "retiro", currentQuantity = 1;
  function showOrderNotice(kind = "added") {
    document.querySelector('[data-template-id="order-sent-notice"]').classList.toggle("hidden", kind !== "added");
    document.querySelector('[data-template-id="order-removed-notice"]').classList.toggle("hidden", kind !== "removed");
    orderNotice.classList.remove("hidden"); setTimeout(() => orderNotice.classList.add("hidden"), 1800);
  }
  function showAddedNotice() { showOrderNotice("added"); }
  const deliveryFee = 5000;

  let ordersReady = false;
  const ordersHandler = { onDataChanged() {} };
  const ordersInit = (async () => {
    if (window.dataSdk) { const r = await window.dataSdk.init(ordersHandler); ordersReady = r.isOk; }
  })();

  const detailModal = document.getElementById("detail-modal");
  const paymentModal = document.getElementById("payment-modal");
  const cartItemsEl = document.getElementById("cart-items");
  const cartTotalEl = document.getElementById("cart-total");
  const checkoutButton = document.getElementById("checkout-button");
  const orderNotice = document.getElementById("order-notice");
  const burgerImgEls = {
    "nacho-prov": document.querySelector('[data-template-id="burger-nacho-prov-img"]'),
    "legendaria": document.querySelector('[data-template-id="burger-legendaria-img"]'),
    "monster": document.querySelector('[data-template-id="burger-monster-img"]'),
    "bbq": document.querySelector('[data-template-id="burger-bbq-img"]'),
    "nacho-ched": document.querySelector('[data-template-id="burger-nacho-ched-img"]')
  };

  function openDetail(burgerId) {
    currentBurgerId = burgerId; currentCombo = "chico"; currentExtras = {}; currentRemovals = {}; currentRemovedIngredients = []; currentQuantity = 1;
    document.getElementById("detail-qty").textContent = "1";
    const b = burgers[burgerId];
    document.getElementById("detail-modal-heading").textContent = b.name;
    const removeList = document.getElementById("remove-ingredients-list");
    removeList.innerHTML = "";
    const ingredientOptions = {
      "nacho-prov": ["Mayonesa ahumada","Doritos","Queso provolone","Panceta"],
      "legendaria": ["Salsa MCB","Queso Cheddar","Cebolla","Lechuga"],
      "monster": ["Mayonesa ahumada","Queso cheddar doble","Panceta doble","Cebolla caramelizada"],
      "bbq": ["Queso crema","Queso cheddar doble","Panceta","Cebolla caramelizada","Barbacoa"],
      "nacho-ched": ["Mayonesa ahumada","Doritos","Queso cheddar","Panceta"]
    };
    ingredientOptions[burgerId].forEach((ingredient, index) => {
      const id = `${burgerId}-ingredient-${index}`;
      currentRemovals[id] = false;
      const label = document.createElement("label");
      label.className = "flex items-center gap-2 rounded-md border border-[#393939] px-3 py-2 text-sm text-[#fff8e8] cursor-pointer hover:border-[#ffc107]";
      label.innerHTML = `<input class="accent-[#ffc107]" type="checkbox" data-remove-id="${id}"><span>${ingredient}</span>`;
      label.querySelector("input").addEventListener("change", e => {
        currentRemovals[id] = e.target.checked;
        currentRemovedIngredients = ingredientOptions[burgerId].filter((_, i) => currentRemovals[`${burgerId}-ingredient-${i}`]);
      });
      removeList.appendChild(label);
    });
    document.getElementById("detail-ingredients").textContent = b.ingredients;
    const imgWrap = document.getElementById("detail-img-wrap");
    imgWrap.innerHTML = "";
    const srcEl = burgerImgEls[burgerId];
    if (srcEl && srcEl.src) {
      const img = document.createElement("img");
      img.src = srcEl.src; img.alt = srcEl.alt || b.name; img.className = "w-full h-full object-cover"; img.loading = "lazy";
      imgWrap.appendChild(img);
    }
    const comboContainer = document.getElementById("combo-options");
    comboContainer.innerHTML = "";
    comboSizes.forEach(cs => {
      const div = document.createElement("button");
      div.type = "button"; div.className = "combo-opt text-left focus-ring" + (cs.id === currentCombo ? " active" : ""); div.dataset.comboId = cs.id;
      div.innerHTML = `<p class="font-bold text-sm text-[#fff8e8] mb-1">${cs.label}</p><p class="text-xs text-[#aaa59b] leading-4 mb-2">${cs.desc}</p><p class="font-bold text-[#ffc107] text-sm">${currency.format(cs.price)}</p>`;
      div.addEventListener("click", () => selectCombo(cs.id));
      comboContainer.appendChild(div);
    });
    const extContainer = document.getElementById("extras-list");
    extContainer.innerHTML = "";
    extras.forEach(ex => {
      currentExtras[ex.id] = 0;
      const row = document.createElement("div");
      row.className = "extra-row";
      row.innerHTML = `<div class="flex-1 min-w-0"><p class="text-sm text-[#fff8e8] font-medium">${getExtraName(ex)}</p><p class="text-xs text-[#aaa59b]">+${currency.format(ex.price)}</p></div><div class="quantity-control flex items-center overflow-hidden rounded-lg border border-[#4a4a4a] shrink-0"><button class="focus-ring grid h-8 w-8 place-items-center text-[#fff8e8] hover:bg-[#393939]" type="button" data-extra-action="dec" data-extra-id="${ex.id}" aria-label="Quitar ${ex.name}"><i data-lucide="minus" class="h-3 w-3"></i></button><span class="grid h-8 min-w-[2rem] place-items-center text-sm font-bold text-[#fff8e8]" data-extra-qty="${ex.id}">0</span><button class="focus-ring grid h-8 w-8 place-items-center text-[#fff8e8] hover:bg-[#393939]" type="button" data-extra-action="inc" data-extra-id="${ex.id}" aria-label="Agregar ${ex.name}"><i data-lucide="plus" class="h-3 w-3"></i></button></div>`;
      extContainer.appendChild(row);
    });
    extContainer.addEventListener("click", handleExtraClick);
    updateSubtotal();
    detailModal.classList.add("is-open");
    lucide.createIcons();
  }

  function selectCombo(id) {
    currentCombo = id;
    document.querySelectorAll("#combo-options .combo-opt").forEach(el => el.classList.toggle("active", el.dataset.comboId === id));
    updateSubtotal();
  }
  function handleExtraClick(e) {
    const btn = e.target.closest("[data-extra-action]"); if (!btn) return;
    const id = btn.dataset.extraId;
    if (btn.dataset.extraAction === "inc") currentExtras[id]++;
    if (btn.dataset.extraAction === "dec") currentExtras[id] = Math.max(0, currentExtras[id] - 1);
    document.querySelector(`[data-extra-qty="${id}"]`).textContent = currentExtras[id];
    updateSubtotal();
  }
  function getTotal() {
    const base = comboSizes.find(c => c.id === currentCombo).price;
    return base + extras.reduce((s, ex) => s + (currentExtras[ex.id] || 0) * ex.price, 0);
  }
  function updateSubtotal() { document.getElementById("detail-subtotal").textContent = currency.format(getTotal()); }
  function closeDetail() { detailModal.classList.remove("is-open"); }
  function addCurrentToCart() {
    const b = burgers[currentBurgerId], combo = comboSizes.find(c => c.id === currentCombo);
    const selExtras = {}; extras.forEach(ex => { if (currentExtras[ex.id] > 0) selExtras[ex.id] = currentExtras[ex.id]; });
    for (let quantity = 0; quantity < currentQuantity; quantity++) cart.push({ cartId: ++cartIdCounter, burgerId: currentBurgerId, burgerName: b.name, comboLabel: combo.label, comboPrice: combo.price, extras: selExtras, removedIngredients: [...currentRemovedIngredients], totalPrice: getTotal() });
    closeDetail(); renderCart(); showAddedNotice();
  }
  function removeFromCart(cartId) { cart = cart.filter(i => i.cartId !== cartId); renderCart(); showOrderNotice("removed"); }

  function renderCart() {
    const emptyState = document.getElementById("empty-cart");
    const existing = new Map([...cartItemsEl.querySelectorAll(".cart-item")].map(el => [parseInt(el.dataset.cartId), el]));
    if (cart.length === 0) {
      existing.forEach(el => el.remove());
      if (!emptyState) {
        const empty = document.createElement("div"); empty.id = "empty-cart";
        empty.className = "rounded-xl border border-dashed border-[#45403a] px-5 py-8 text-center";
        empty.innerHTML = '<i data-lucide="shopping-basket" class="mx-auto mb-3 h-7 w-7 text-[#ffc107]"></i><p class="text-sm leading-6 text-[#aaa59b]">Tu carrito está vacío. Elegí algo rico del menú.</p>';
        cartItemsEl.appendChild(empty); lucide.createIcons();
      }
    } else {
      if (emptyState) emptyState.remove();
      cart.forEach(item => {
        let el = existing.get(item.cartId);
        if (!el) { el = document.createElement("article"); el.className = "cart-item rounded-xl border border-[#393939] bg-[#242424] p-4"; el.dataset.cartId = item.cartId; cartItemsEl.appendChild(el); }
        let removedHtml = item.removedIngredients?.length ? `<div class="mt-2 text-xs text-[#ffcf70]">Sin: ${item.removedIngredients.join(", ")}</div>` : "";
        let extrasHtml = "";
        if (Object.keys(item.extras).length > 0) {
          extrasHtml = `<div class="mt-2 leading-5">${Object.entries(item.extras).map(([exId, qty]) => { const ex = extras.find(e => e.id === exId); return `<span class="text-xs text-[#aaa59b]">+ ${qty}x ${getExtraName(ex)} (${currency.format(ex.price * qty)})</span>`; }).join("<br>")}</div>`;
        }
        el.innerHTML = `<div class="mb-2 flex items-start justify-between gap-3"><div class="flex-1 min-w-0"><p class="font-semibold leading-5 text-[#ffc107] text-sm">${item.burgerName}</p><p class="text-xs text-[#aaa59b] mt-1">${item.comboLabel}: ${currency.format(item.comboPrice)}</p>${extrasHtml}${removedHtml}</div><p class="shrink-0 text-sm font-bold text-[#fff8e8]">${currency.format(item.totalPrice)}</p></div><button class="remove-item focus-ring text-xs font-bold uppercase tracking-wide text-[#d97878] hover:text-[#ff9f9f]" type="button">Quitar</button>`;
        el.querySelector(".remove-item").addEventListener("click", () => removeFromCart(item.cartId));
        existing.delete(item.cartId);
      });
      existing.forEach(el => el.remove());
    }
    cartTotalEl.textContent = currency.format(cart.reduce((s, i) => s + i.totalPrice, 0));
    checkoutButton.disabled = cart.length === 0;
  }

  function updateDeliveryUI() {
    const pickup = document.getElementById("pickup-button"), delivery = document.getElementById("delivery-button");
    pickup.className = `canva-button focus-ring rounded-xl border-2 px-3 py-3 text-sm font-bold ${deliveryMethod === "retiro" ? "border-[#ffc107] bg-[#ffc107] text-[#101010]" : "border-[#393939] bg-[#242424] text-[#fff8e8]"}`;
    delivery.className = `canva-button focus-ring rounded-xl border-2 px-3 py-3 text-sm font-bold ${deliveryMethod === "envio" ? "border-[#ffc107] bg-[#ffc107] text-[#101010]" : "border-[#393939] bg-[#242424] text-[#fff8e8]"}`;
    const summary = document.getElementById("payment-total-summary");
    const subtotal = cart.reduce((s, i) => s + i.totalPrice, 0), shipping = deliveryMethod === "envio" ? deliveryFee : 0;
    if (summary) {
      summary.innerHTML = deliveryMethod === "envio"
        ? `<div class="flex justify-between gap-4"><span>Subtotal del pedido</span><strong>${currency.format(subtotal)}</strong></div><div class="flex justify-between gap-4 text-[#ffc107]"><span>Envío a domicilio</span><strong>+${currency.format(deliveryFee)}</strong></div><div class="mt-2 flex justify-between gap-4 border-t border-[#393939] pt-2 text-base font-bold"><span>Total final</span><strong>${currency.format(subtotal + shipping)}</strong></div>`
        : `<div class="flex justify-between gap-4"><span>Subtotal del pedido</span><strong>${currency.format(subtotal)}</strong></div><div class="flex justify-between gap-4 text-[#aaa59b]"><span>Envío</span><strong>Sin costo</strong></div><div class="mt-2 flex justify-between gap-4 border-t border-[#393939] pt-2 text-base font-bold"><span>Total final</span><strong>${currency.format(subtotal)}</strong></div>`;
    }
  }
  function openPaymentModal() { if (cart.length === 0) return; deliveryMethod = "retiro"; updateDeliveryUI(); paymentModal.classList.add("is-open"); }
  function closePaymentModal() { paymentModal.classList.remove("is-open"); }

  async function sendOrder(method) {
    if (cart.length === 0) return;
    const phone = "542996285998";
    const details = cart.map((item, i) => {
      let line = `${i+1}. *${item.burgerName}* — ${item.comboLabel} (${currency.format(item.comboPrice)})`;
      const b = burgers[item.burgerId];
      if (b) line += `\n   📝 ${b.ingredients}`;
      if (Object.keys(item.extras).length > 0) Object.entries(item.extras).forEach(([exId, qty]) => { const ex = extras.find(e => e.id === exId); line += `\n   + ${qty}x ${getExtraName(ex)}: ${currency.format(ex.price * qty)}`; });
      if (item.removedIngredients?.length) line += `\n   🚫 *Sin:* ${item.removedIngredients.join(", ")}`;
      line += `\n   *Subtotal: ${currency.format(item.totalPrice)}*`;
      return line;
    }).join("\n\n");
    const subtotal = cart.reduce((s, i) => s + i.totalPrice, 0), shipping = deliveryMethod === "envio" ? deliveryFee : 0, total = subtotal + shipping;
    const customerName = document.getElementById("customer-name").value.trim() || "No especificado";
    const customerAddress = document.getElementById("customer-address").value.trim() || (deliveryMethod === "envio" ? "Dirección no especificada" : "Retiro en local");
    const customerNotes = document.getElementById("customer-notes").value.trim();
    const deliveryText = deliveryMethod === "envio" ? `🛵 *Envío a domicilio en Cipolletti:* ${currency.format(deliveryFee)}` : "🏪 *Modalidad:* Paso a retirar";
    const payText = method === "transferencia" ? "💳 *Método:* Transferencia.\nAlias: *Miguel77c*" : "💵 *Método:* Efectivo al recibir.";
    const notesText = customerNotes ? `\n💬 *Notas generales:* ${customerNotes}` : "";
    const msg = `🍔 *NUEVO PEDIDO - MCBURGUER*\n\n👤 *Cliente:* ${customerName}\n📍 *Dirección/Entrega:* ${customerAddress}\n\n📋 *DETALLE DEL PEDIDO:*\n${details}\n\n${deliveryText}\n💰 *TOTAL A PAGAR: ${currency.format(total)}*\n\n${payText}${notesText}`;

    const btn = method === "transferencia" ? document.getElementById("transfer-button") : document.getElementById("cash-button");
    btn.disabled = true;
    await ordersInit;
    if (ordersReady) {
      const saveResult = await window.dataSdk.create({ order_id: `MCB-${Date.now()}`, created_at: new Date().toISOString(), customer_name: customerName, delivery_address: customerAddress, delivery_method: deliveryMethod, payment_method: method, items_detail: details, customer_notes: customerNotes, subtotal, delivery_fee: shipping, total, whatsapp_message: msg });
      if (!saveResult.isOk) { btn.disabled = false; return; }
    }
    btn.disabled = false;
    window.open(`https://wa.me/+${phone}?text=${encodeURIComponent(msg)}`, "_blank", "noopener,noreferrer");
    cart = []; renderCart(); paymentModal.classList.remove("is-open");
    showOrderNotice("added");
  }

  // Sauce cards
  const saucesList = document.getElementById("sauces-list");
  sauces.forEach((sauce, index) => {
    const card = document.createElement("button"); card.type = "button";
    card.className = "canva-button focus-ring rounded-xl border border-[#393939] bg-[#1b1b1b] p-4 text-left transition hover:-translate-y-1 hover:border-[#ffc107]";
    card.innerHTML = `<span class="block font-bold text-[#ffc107]">${sauce}</span><span class="mt-1 block text-sm text-[#aaa59b]">${currency.format(saucePrice)}</span>`;
    card.addEventListener("click", () => { cart.push({ cartId: ++cartIdCounter, burgerId: `sauce-${index}`, burgerName: `Salsa ${sauce}`, comboLabel: "Porción individual", comboPrice: saucePrice, extras: {}, removedIngredients: [], totalPrice: saucePrice }); renderCart(); showAddedNotice(); });
    saucesList.appendChild(card);
  });

  // Event listeners
  document.querySelectorAll("[data-combo-special]").forEach(card => {
    card.addEventListener("click", () => { const combo = specialCombos[card.dataset.comboSpecial]; cart.push({ cartId: ++cartIdCounter, burgerId: `special-${card.dataset.comboSpecial}`, burgerName: combo.name, comboLabel: "Combo especial", comboPrice: combo.price, extras: {}, removedIngredients: [], totalPrice: combo.price }); renderCart(); showAddedNotice(); });
  });
  document.querySelectorAll("[data-burger]").forEach(card => card.addEventListener("click", () => openDetail(card.dataset.burger)));
  document.querySelectorAll("[data-drink]").forEach(card => {
    card.addEventListener("click", () => { const drinkId = card.dataset.drink; cart.push({ cartId: ++cartIdCounter, burgerId: drinkId, burgerName: drinks[drinkId], comboLabel: "Lata 354 ml", comboPrice: drinkPrice, extras: {}, removedIngredients: [], totalPrice: drinkPrice }); renderCart(); showAddedNotice(); });
  });
  document.getElementById("detail-qty-minus").addEventListener("click", () => { currentQuantity = Math.max(1, currentQuantity - 1); document.getElementById("detail-qty").textContent = currentQuantity; });
  document.getElementById("detail-qty-plus").addEventListener("click", () => { currentQuantity = Math.min(20, currentQuantity + 1); document.getElementById("detail-qty").textContent = currentQuantity; });
  document.getElementById("close-detail").addEventListener("click", closeDetail);
  document.getElementById("add-to-cart-btn").addEventListener("click", addCurrentToCart);
  checkoutButton.addEventListener("click", openPaymentModal);
  document.getElementById("close-modal-button").addEventListener("click", closePaymentModal);
  document.getElementById("back-to-menu-button").addEventListener("click", closePaymentModal);
  document.getElementById("pickup-button").addEventListener("click", () => { deliveryMethod = "retiro"; updateDeliveryUI(); });
  document.getElementById("delivery-button").addEventListener("click", () => { deliveryMethod = "envio"; updateDeliveryUI(); });
  document.getElementById("transfer-button").addEventListener("click", () => sendOrder("transferencia"));
  document.getElementById("cash-button").addEventListener("click", () => sendOrder("efectivo"));
  detailModal.addEventListener("click", e => { if (e.target === detailModal) closeDetail(); });
  paymentModal.addEventListener("click", e => { if (e.target === paymentModal) closePaymentModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { if (detailModal.classList.contains("is-open")) closeDetail(); else if (paymentModal.classList.contains("is-open")) closePaymentModal(); } });

  lucide.createIcons();
  renderCart();
  </script>
 </body>
</html>
